# CI runs on every push and pull request (this repository is public, so Actions minutes are free). A green
# push to main then starts the Amplify job for that exact commit through GitHub OIDC; Amplify's own
# auto-build is off on main. The role (infra/github-deploy) trusts refs/heads/main of this repository only
# and may only start and read jobs on this app's main branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: AnthusAI/Papyrus/.github/workflows/amplify-deploy.yml@main
    with:
      app-id: dfkbdffs2viq8
      role-to-assume: arn:aws:iam::335163751677:role/tactus-web-github-deploy
