.edge{fill:none;stroke:#7a4b2a;stroke-width:1.75}
.head{fill:#7a4b2a}
@media (prefers-color-scheme:dark){.node rect{fill:#2a241d;stroke:#d9a679}.node text{fill:#f4efe6}.edge{stroke:#d9a679}.head{fill:#d9a679}}
</style>
