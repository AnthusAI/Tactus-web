<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="title description">
<title id="title">Deep integration architecture</title>
<desc id="description">A user presses a button in your product. The Tactus runtime starts a procedure, which calls tools and APIs that change state in your system, or queues work for human review. Results flow back to the runtime and the button.</desc>
